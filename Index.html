<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VR Workshop</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6fa;color:#202938}
header{background:white;padding:16px 20px;border-bottom:1px solid #e1e5ed}
header h1{margin:0;font-size:23px;color:#2463eb}
header p{margin:5px 0 0;color:#778196;font-size:13px}
main{padding:14px;max-width:1100px;margin:auto}
#viewer{height:52vh;min-height:300px;background:#e9edf5;border-radius:16px;overflow:hidden;position:relative}
#viewer canvas{display:block;width:100%;height:100%}
.panel{background:white;padding:16px;border-radius:16px;margin-top:14px}
h2{font-size:16px;margin:0 0 12px}
.buttons{display:flex;flex-wrap:wrap;gap:8px}
button{border:0;border-radius:10px;padding:12px 15px;background:#edf2ff;color:#2458c5;font-weight:bold;font-size:14px}
button.primary{background:#2463eb;color:white}
button.dark{background:#202938;color:white}
button:active{opacity:.7}
label{display:block;font-size:13px;margin:13px 0 6px;color:#657087}
input[type=range]{width:100%}
input[type=color]{width:100%;height:40px;border:0;background:white}
#status{font-size:12px;color:#68758a;margin-top:10px}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>
<header>
  <h1>VR Workshop</h1>
  <p>Ton atelier de création 3D en réalité virtuelle</p>
</header>

<main>
  <div id="viewer"></div>

  <section class="panel">
    <h2>Ajouter un objet</h2>
    <div class="buttons">
      <button onclick="addObject('cube')">＋ Cube</button>
      <button onclick="addObject('sphere')">＋ Sphère</button>
      <button onclick="addObject('cylinder')">＋ Cylindre</button>
    </div>
  </section>

  <section class="panel">
    <h2>Modifier l'objet sélectionné</h2>
    <label>Taille</label>
    <input id="scale" type="range" min="0.2" max="3" step="0.1" value="1">
    <label>Couleur</label>
    <input id="color" type="color" value="#2463eb">
    <div class="buttons">
      <button onclick="rotateObject(-0.3)">↶ Tourner</button>
      <button onclick="rotateObject(0.3)">↷ Tourner</button>
      <button onclick="deleteObject()">Supprimer</button>
    </div>
  </section>

  <section class="panel">
    <h2>Réalité virtuelle et mixte</h2>
    <div class="buttons">
      <button class="primary" onclick="enterVR()">Entrer en VR</button>
      <button class="dark" onclick="enterMR()">Entrer en MR</button>
    </div>
    <p id="status">Atelier prêt. Sélectionne un objet en appuyant dessus.</p>
  </section>
</main>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const viewer = document.getElementById('viewer');
const status = document.getElementById('status');

const scene = new THREE.Scene();
scene.background = new THREE.Color('#e9edf5');

const camera = new THREE.PerspectiveCamera(
  60, viewer.clientWidth / viewer.clientHeight, 0.1, 100
);
camera.position.set(4, 3, 6);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(viewer.clientWidth,viewer.clientHeight);
renderer.xr.enabled = true;
viewer.appendChild(renderer.domElement);

const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff,0x8794aa,2));

const light = new THREE.DirectionalLight(0xffffff,2);
light.position.set(4,8,5);
scene.add(light);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(20,20),
  new THREE.MeshStandardMaterial({color:'#f8faff'})
);
floor.rotation.x=-Math.PI/2;
floor.position.y=-0.02;
scene.add(floor);

const grid = new THREE.GridHelper(20,20,0x9aa8c0,0xd5dce8);
scene.add(grid);

let objects=[];
let selected=null;

function addObject(type){
  let geometry;

  if(type==='cube') geometry=new THREE.BoxGeometry(1,1,1);
  if(type==='sphere') geometry=new THREE.SphereGeometry(0.6,32,24);
  if(type==='cylinder') geometry=new THREE.CylinderGeometry(0.5,0.5,1,32);

  const material=new THREE.MeshStandardMaterial({
    color:document.getElementById('color').value,
    roughness:0.55
  });

  const object=new THREE.Mesh(geometry,material);
  object.position.set(
    (Math.random()-0.5)*1.5,
    0.55,
    (Math.random()-0.5)*1.5
  );

  scene.add(object);
  objects.push(object);
  selectObject(object);
}

function selectObject(object){
  selected=object;
  if(object){
    document.getElementById('scale').value=object.scale.x;
    document.getElementById('color').value='#'+object.material.color.getHexString();
    status.textContent='Objet sélectionné.';
  }
}

window.addObject=addObject;

document.getElementById('scale').addEventListener('input',e=>{
  if(selected){
    const s=Number(e.target.value);
    selected.scale.set(s,s,s);
  }
});

document.getElementById('color').addEventListener('input',e=>{
  if(selected) selected.material.color.set(e.target.value);
});

window.rotateObject=(angle)=>{
  if(selected) selected.rotation.y+=angle;
};

window.deleteObject=()=>{
  if(!selected)return;
  scene.remove(selected);
  objects=objects.filter(o=>o!==selected);
  selected.geometry.dispose();
  selected.material.dispose();
  selected=null;
  status.textContent='Objet supprimé.';
};

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();

renderer.domElement.addEventListener('pointerdown',event=>{
  const rect=renderer.domElement.getBoundingClientRect();
  pointer.x=((event.clientX-rect.left)/rect.width)*2-1;
  pointer.y=-((event.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(pointer,camera);
  const hits=raycaster.intersectObjects(objects);
  if(hits.length) selectObject(hits[0].object);
});

async function enterVR(){
  if(!navigator.xr){
    status.textContent='WebXR indisponible dans ce navigateur. Essaie le navigateur du Quest 3.';
    return;
  }
  try{
    const supported=await navigator.xr.isSessionSupported('immersive-vr');
    if(!supported){
      status.textContent='Le mode VR n’est pas pris en charge ici.';
      return;
    }
    const session=await navigator.xr.requestSession('immersive-vr',{
      optionalFeatures:['local-floor','bounded-floor']
    });
    await renderer.xr.setSession(session);
    controls.enabled=false;
    session.addEventListener('end',()=>controls.enabled=true);
    status.textContent='Mode VR activé.';
  }catch(error){
    status.textContent='Impossible de lancer la VR : '+error.message;
  }
}

async function enterMR(){
  if(!navigator.xr){
    status.textContent='WebXR indisponible dans ce navigateur.';
    return;
  }
  try{
    const supported=await navigator.xr.isSessionSupported('immersive-ar');
    if(!supported){
      status.textContent='Le mode MR n’est pas pris en charge par ce navigateur.';
      return;
    }
    const session=await navigator.xr.requestSession('immersive-ar',{
      optionalFeatures:['local-floor','hit-test']
    });
    await renderer.xr.setSession(session);
    controls.enabled=false;
    session.addEventListener('end',()=>controls.enabled=true);
    status.textContent='Session MR activée si le casque la prend en charge.';
  }catch(error){
    status.textContent='Impossible de lancer la MR : '+error.message;
  }
}

window.enterVR=enterVR;
window.enterMR=enterMR;

function animate(){
  controls.update();
  renderer.render(scene,camera);
}
renderer.setAnimationLoop(animate);

window.addEventListener('resize',()=>{
  const w=viewer.clientWidth;
  const h=viewer.clientHeight;
  camera.aspect=w/h;
  camera.updateProjectionMatrix();
  renderer.setSize(w,h);
});

addObject('cube');
</script>
</body>
</html>
